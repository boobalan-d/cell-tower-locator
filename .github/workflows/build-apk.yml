name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run accuracy tests
        run: gradle testDebugUnitTest --no-daemon -i | grep -E "error =|Test.*(PASSED|FAILED)" || true

      - name: Verify tests passed
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CellTowerLocator-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk CellTowerLocator.apk

      - name: Publish to Releases (direct phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cell Tower Locator (latest build)
          body: |
            Automatic build of commit ${{ github.sha }}.
            Download **CellTowerLocator.apk** below and install it on Android 10 or newer.
          files: CellTowerLocator.apk
          make_latest: true
